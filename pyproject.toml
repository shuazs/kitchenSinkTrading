[project]
name = "kitchensink-backtester"
version = "0.1.0"
description = "Pluggable backtesting engine for retail trading strategy research"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "requests", "yfinance"]

[project.optional-dependencies]
sentiment = ["transformers", "torch", "zstandard"]
polymarket = ["pyarrow", "fsspec", "aiohttp"]
ml = ["scikit-learn", "lightgbm", "torch", "scipy"]
mentions = ["torch", "transformers", "peft", "scikit-learn", "pyarrow"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backtester*"]

[tool.setuptools.package-data]
"backtester.data" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
